name: Build SEO Pages

on:
  push:
    branches: ["main"]
    paths:
      - "content.json"
      - "index.template.html"
      - "about.template.html"
      - "case-study.template.html"
      - "build/generate-pages.js"
      - ".github/workflows/build-seo-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate pages and SEO files
        run: node build/generate-pages.js

      - name: Commit generated files if changed
        run: |
          if git diff --quiet -- index.html about.html case-study.html engagement-models.html DigitalTransformation.html sales-crm.html sitemap.xml robots.txt; then
            echo "No generated file changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html case-study.html engagement-models.html DigitalTransformation.html sales-crm.html sitemap.xml robots.txt
          git commit -m "chore: regenerate SEO pages"
          git push
